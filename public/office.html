<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Tekneci Digital - İstanbul Boğazı Manzaralı 3D Otonom Ofis</title>
    <style>
        body { margin: 0; background: #050b14; color: #fff; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; overflow: hidden; }
        #ui { position: absolute; top: 15px; left: 15px; background: rgba(10, 15, 30, 0.85); padding: 20px; border-radius: 12px; border: 1px solid rgba(0, 255, 204, 0.3); width: 340px; box-shadow: 0 10px 30px rgba(0,0,0,0.7); backdrop-filter: blur(12px); }
        h2 { margin: 0 0 12px 0; font-size: 17px; color: #00ffcc; display: flex; align-items: center; gap: 8px; }
        .agent-info { font-size: 13px; margin-bottom: 8px; border-left: 4px solid; padding-left: 10px; opacity: 0.95; }
        #status { font-size: 12px; color: #00ffcc; margin-top: 12px; font-weight: bold; text-shadow: 0 0 5px rgba(0,255,200,0.5); }
    </style>
</head>
<body>
    <div id="ui">
        <h2>🌉 Tekneci Digital Boğaz Ofisi</h2>
        <div class="agent-info" style="border-color: #ff5722;"><b>Senarist (Turuncu):</b> Strateji & Senaryo</div>
        <div class="agent-info" style="border-color: #4CAF50;"><b>Atasözü Uzmanı (Yeşil):</b> Kültür & Dil Motoru</div>
        <div class="agent-info" style="border-color: #2196F3;"><b>Oyun Uzmanı (Mavi):</b> Bulmaca & Kod Kurgusu</div>
        <div class="agent-info" style="border-color: #ffeb3b;"><b>Shorts Uzmanı (Sarı):</b> YouTube Video & Trend</div>
        <div id="status">● Canlı: Masalar Boğaza Bakıyor & Ajanlar Çalışıyor</div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0a1128); // Boğaz akşamüstü/gece tonu
        scene.fog = new THREE.FogExp2(0x0a1128, 0.015);

        const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 12, 22);
        camera.lookAt(0, 2, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        document.body.appendChild(renderer.domElement);

        // --- İSTANBUL BOĞAZI MANZARASI ARKA PLAN (Ufuk ve Köprü Efekti) ---
        // Boğaz Suyu (Ön plan / Arka plan katmanı)
        const waterGeo = new THREE.PlaneGeometry(100, 100);
        const waterMat = new THREE.MeshBasicMaterial({ color: 0x0e294b });
        const water = new THREE.Mesh(waterGeo, waterMat);
        water.rotation.x = -Math.PI / 2;
        water.position.set(0, -0.1, -25);
        scene.add(water);

        // Boğaz Silüeti ve Işıklar (Ufuktaki şehir silüeti simülasyonu)
        for(let i = -30; i <= 30; i += 3) {
            const height = 2 + Math.random() * 6;
            const bldgGeo = new THREE.BoxGeometry(2.5, height, 1);
            const bldgMat = new THREE.MeshBasicMaterial({ color: i % 2 === 0 ? 0x1b263b : 0x0d1b2a });
            const bldg = new THREE.Mesh(bldgGeo, bldgMat);
            bldg.position.set(i, height / 2 - 1, -35);
            scene.add(bldg);
        }

        // --- OFİS İÇ MEKANI ---
        // Şık Parke Zemin
        const floorGeo = new THREE.PlaneGeometry(24, 24);
        const floorMat = new THREE.MeshStandardMaterial({ color: 0x151922, roughness: 0.6 });
        const floor = new THREE.Mesh(floorGeo, floorMat);
        floor.rotation.x = -Math.PI / 2;
        floor.receiveShadow = true;
        scene.add(floor);

        // Komple Cam Cephe (Arka tarafta Boğaz manzarasına bakan camlar)
        const glassMat = new THREE.MeshPhysicalMaterial({ color: 0x88ccff, transparent: true, opacity: 0.25, roughness: 0.1, metalness: 0.1 });
        const glassWall = new THREE.Mesh(new THREE.BoxGeometry(24, 12, 0.2), glassMat);
        glassWall.position.set(0, 6, -12);
        scene.add(glassWall);

        // Işıklandırma
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0x00ffcc, 0.8); // Camdan süzülen şık aydınlatma
        dirLight.position.set(0, 20, -10);
        scene.add(dirLight);

        // --- AJANLAR VE MASALAR (HEPSİ MANZARAYA - ARKAYA/CAMA BAKIYOR) ---
        // Masalar arka cama yakın (-Z yönünde) yerleştirildi ve karakterler -Z yönüne (manzaraya) bakıyor.
        const agentsConfig = [
            { name: "Senarist", color: 0xff5722, x: -5, z: -6 },
            { name: "Atasözü Uzmanı", color: 0x4CAF50, x: -1.7, z: -6 },
            { name: "Oyun Uzmanı", color: 0x2196F3, x: 1.7, z: -6 },
            { name: "Shorts Uzmanı", color: 0xffeb3b, x: 5, z: -6 }
        ];

        const gameCharacters = [];

        agentsConfig.forEach((cfg, idx) => {
            // Masa
            const deskGroup = new THREE.Group();
            const topMat = new THREE.MeshStandardMaterial({ color: 0x222831, roughness: 0.4 });
            const top = new THREE.Mesh(new THREE.BoxGeometry(2.8, 0.15, 1.4), topMat);
            top.position.y = 1.1;
            top.castShadow = true;
            deskGroup.add(top);

            // Monitör (Manzaraya bakan tarafta)
            const monitorMat = new THREE.MeshStandardMaterial({ color: 0x050505, emissive: cfg.color, emissiveIntensity: 0.5 });
            const monitor = new THREE.Mesh(new THREE.BoxGeometry(1.0, 0.6, 0.08), monitorMat);
            monitor.position.set(0, 1.6, -0.4);
            deskGroup.add(monitor);

            deskGroup.position.set(cfg.x, 0, cfg.z);
            scene.add(deskGroup);

            // Oyun Karakteri / Avatar Modeli (Robotik/Stylized Game Character)
            const charGroup = new THREE.Group();

            // Gövde (Zırhlı/Oyun karakteri tarzı)
            const torsoMat = new THREE.MeshStandardMaterial({ color: cfg.color, metalness: 0.3, roughness: 0.4 });
            const torso = new THREE.Mesh(new THREE.BoxGeometry(0.6, 0.9, 0.4), torsoMat);
            torso.position.y = 1.0;
            torso.castShadow = true;
            charGroup.add(torso);

            // Kafa (Kasklı/Oyun karakteri başı)
            const headMat = new THREE.MeshStandardMaterial({ color: 0xdddddd, metalness: 0.5 });
            const head = new THREE.Mesh(new THREE.BoxGeometry(0.4, 0.4, 0.4), headMat);
            head.position.y = 1.6;
            head.castShadow = true;
            charGroup.add(head);

            // Karakterler masanın önünde oturur/durur ve manzaraya (arkaya, -Z yönüne) bakar
            charGroup.position.set(cfg.x, 0, cfg.z + 0.9);
            charGroup.rotation.y = Math.PI; // Manzaraya dönük
            scene.add(charGroup);

            gameCharacters.push({
                mesh: charGroup,
                baseX: cfg.x,
                baseZ: cfg.z + 0.9,
                offset: idx * 1.2
            });
        });

        // Animasyon (Oyun karakterlerinin hafif çalışma ve nefes alma hareketleri)
        const clock = new THREE.Clock();
        function animate() {
            requestAnimationFrame(animate);
            const time = clock.getElapsedTime();

            gameCharacters.forEach((char, i) => {
                // Hafif nefesten dolayı yukarı aşağı esneme ve klavye başında çalışma hareketi
                char.mesh.position.y = Math.abs(Math.sin(time * 5 + char.offset)) * 0.08;
            });

            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
