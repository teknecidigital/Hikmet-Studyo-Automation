<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Tekneci Digital - 2D Kuş Bakışı Otonom Ofis Katı</title>
    <style>
        body { margin: 0; background: #0f111a; color: #fff; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; overflow: hidden; display: flex; height: 100vh; }
        
        /* Sol taraf: Canlı Akış ve Kontrol Paneli */
        #sidebar { width: 350px; background: #151823; border-right: 2px solid #222639; display: flex; flex-direction: column; padding: 20px; box-shadow: 5px 0 15px rgba(0,0,0,0.5); z-index: 10; }
        h2 { font-size: 18px; color: #00ffcc; margin-top: 0; margin-bottom: 15px; display: flex; align-items: center; gap: 8px; }
        .log-box { flex-grow: 1; background: #0b0d13; border: 1px solid #222639; border-radius: 8px; padding: 12px; overflow-y: auto; font-family: monospace; font-size: 12px; color: #00ffcc; line-height: 1.4; }
        
        /* Sağ taraf: 2D Kuş Bakışı Ofis Katı */
        #office-container { flex-grow: 1; position: relative; background: #121520; display: flex; justify-content: center; align-items: center; }
        canvas { box-shadow: 0 0 40px rgba(0,0,0,0.8); border-radius: 12px; background: #1a1e29; }
        
        .legend { font-size: 12px; color: #888; margin-top: 15px; border-top: 1px solid #222639; padding-top: 10px; }
    </style>
</head>
<body>

    <div id="sidebar">
        <h2>🏢 Otonom Ofis Paneli</h2>
        <div style="font-size: 13px; color: #aaa; margin-bottom: 10px;">Kuş bakışı odalar ve anlık ajan aktiviteleri:</div>
        <div class="log-box" id="logStream">
            [Sistem]: 2D Kuş bakışı ofis katı başlatıldı.<br>
            [Sistem]: Odalar arası veri akışı bekleniyor...<br>
        </div>
        <div class="legend">
            <b>Durum:</b> Ajanlar kendi özel odalarında otonom olarak görevlerini icra ediyor.
        </div>
    </div>

    <div id="office-container">
        <canvas id="officeCanvas" width="800" height="600"></canvas>
    </div>

    <script>
        const canvas = document.getElementById('officeCanvas');
        const ctx = canvas.getContext('2d');
        const logStream = document.getElementById('logStream');

        // Odaların ve Ajanların Tanımları (Kuş Bakışı 2D Koordinatlar)
        const rooms = [
            { id: 'senarist', name: 'Senarist Odası', x: 50, y: 50, w: 320, h: 220, color: '#ff5722', agent: 'Hollywood Senaristi', status: 'Strateji Belirliyor' },
            { id: 'atasozu', name: 'Atasözü Departmanı', x: 430, y: 50, w: 320, h: 220, color: '#4CAF50', agent: 'Kültür Uzmanı', status: 'Veri Taranıyor' },
            { id: 'oyun', name: 'Oyun Geliştirme', x: 50, y: 310, w: 320, h: 220, color: '#2196F3', agent: 'Bulmaca Uzmanı', status: 'Kod Üretiliyor' },
            { id: 'shorts', name: 'YouTube Shorts Stüdyosu', x: 430, y: 310, w: 320, h: 220, color: '#ffeb3b', agent: 'Video Uzmanı', status: 'Kanal Aktif' }
        ];

        // Hareketli iş parçacıkları / sinyaller için animasyon değişkeni
        let pulseAngle = 0;

        function addLog(text) {
            logStream.innerHTML += `> ${text}<br>`;
            logStream.scrollTop = logStream.scrollHeight;
        }

        // Örnek Otonom Akış Simülasyonu (Her 4 saniyede bir oda aktivitesi değişir)
        const activities = [
            "Senarist sonraki yayın stratejisini onayladı.",
            "Atasözü uzmanı veritabanından yeni deyim çekti.",
            "Oyun modülü yeni bulmaca sorusunu kurguladı.",
            "YouTube Shorts videosu otomatik olarak kanala yüklendi! 🚀"
        ];

        let actIndex = 0;
        setInterval(() => {
            const currentAct = activities[actIndex % activities.length];
            addLog(currentAct);
            
            // Rastgele bir odanın durumunu hareketlendir
            rooms.forEach(r => r.active = false);
            rooms[actIndex % rooms.length].active = true;

            actIndex++;
        }, 4000);

        function drawOffice() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            pulseAngle += 0.05;

            // Ofis Koridorları / Zemin Arka Planı
            ctx.fillStyle = '#161924';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Odaları Çiz
            rooms.forEach(room => {
                // Oda zemin kutusu
                ctx.fillStyle = room.active ? '#1e2436' : '#141824';
                ctx.fillRect(room.x, room.y, room.w, room.h);

                // Oda Çerçevesi (Aktifse parlar)
                ctx.strokeStyle = room.color;
                ctx.lineWidth = room.active ? 3 : 1.5;
                ctx.strokeRect(room.x, room.y, room.w, room.h);

                // Oda Başlığı
                ctx.fillStyle = room.color;
                ctx.font = 'bold 14px Segoe UI';
                ctx.fillText(room.name, room.x + 15, room.y + 25);

                // Ajan Bilgisi
                ctx.fillStyle = '#ffffff';
                ctx.font = '12px Segoe UI';
                ctx.fillText(`Ajan: ${room.agent}`, room.x + 15, room.y + 55);
                
                // Durum Metni
                ctx.fillStyle = room.active ? '#00ffcc' : '#888';
                ctx.fillText(`Durum: ${room.status}`, room.x + 15, room.y + 80);

                // Oda İçindeki Çalışma Masası (Küçük 2D Kutu)
                ctx.fillStyle = '#2c3247';
                ctx.fillRect(room.x + 40, room.y + 110, 100, 60);
                ctx.strokeStyle = room.color;
                ctx.strokeRect(room.x + 40, room.y + 110, 100, 60);

                ctx.fillStyle = '#aaa';
                ctx.font = '10px monospace';
                ctx.fillText('Masa & Bilgisayar', room.x + 48, room.y + 145);

                // Hareketli Çalışma Sinyali (Aktif odada yanıp sönen radar/çalışma işareti)
                if (room.active) {
                    let radius = 10 + Math.sin(pulseAngle * 3) * 4;
                    ctx.beginPath();
                    ctx.arc(room.x + room.w - 30, room.y + 40, radius, 0, Math.PI * 2);
                    ctx.fillStyle = room.color;
                    ctx.fill();
                }
            });

            requestAnimationFrame(drawOffice);
        }

        drawOffice();
    </script>
</body>
</html>
